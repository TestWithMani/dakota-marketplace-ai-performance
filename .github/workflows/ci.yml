# Unit tests and static import checks. Full browser E2E is not run here (needs secrets + Chrome).
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile chatbot_tester.py config.py

      - name: Run tests
        env:
          CI: "true"
        run: pytest tests/ -q
